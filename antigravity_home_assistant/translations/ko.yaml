---
configuration:
  remote_control_name:
    name: Remote Control 인스턴스 이름
    description: Antigravity Remote Control 대시보드에 이 HAOS App을 표시할 영문 소문자 이름입니다.
  antigravity_sensitive_data_access:
    name: 민감한 HA 데이터 진단 읽기 허용
    description: >-
      끄면 Antigravity가 secrets.yaml, .storage 및 Recorder 데이터베이스에
      접근하지 못합니다. 켜면 진단 목적의 Recorder 읽기만 허용됩니다. 비밀,
      자격 증명, 정책 파일과 보호 데이터 쓰기는 계속 차단됩니다. 변경 후 App을
      재시작하세요.
  home_assistant_browser_auto_auth:
    name: 헤드리스 브라우저 자동 인증
    description: >-
      브라우저 검증용 로컬 전용·읽기 전용 Home Assistant 사용자를 자동으로
      만들거나 재사용합니다. 변경 후 App을 재시작하세요.
  log_level:
    name: App 로그 수준
    description: trace 또는 debug에서 상세 서비스 로그를 활성화합니다. 비밀값과 Authorization 헤더는 기록하지 않습니다.

---
configuration:
  remote_control_name:
    name: Remote Control instance name
    description: Lowercase name shown for this HAOS App in the Antigravity Remote Control dashboard.
  antigravity_sensitive_data_access:
    name: Allow diagnostic reads of sensitive HA data
    description: >-
      Keep disabled to block Antigravity from secrets.yaml, .storage, and the
      Recorder database. When enabled, Antigravity may read only the Recorder
      database for diagnostics. Secrets, credentials, policy files, and all
      writes to protected data remain blocked. Restart the App after changing
      this option.
  home_assistant_browser_auto_auth:
    name: Headless browser automatic authentication
    description: >-
      Automatically create or reuse a dedicated local-only, read-only Home
      Assistant identity for browser validation. Restart the App after changing
      this option.
  log_level:
    name: App log level
    description: Enables detailed service logs for trace or debug. Secrets and authorization headers are never logged.

---
name: Antigravity for Home Assistant
version: "2.0.15"
breaking_versions:
  - "2.0.0"
  - "2.0.7"
  - "2.0.9"
  - "2.0.11"
  - "2.0.12"
  - "2.0.13"
slug: antigravity_home_assistant
description: Antigravity CLI with verified feedback, browser, terminal, and SSH for Home Assistant
url: https://github.com/Kanu-Coffee/antigravity-for-home-assistant
stage: experimental
boot: manual
init: false
arch:
  - aarch64
  - amd64
image: ghcr.io/kanu-coffee/antigravity-for-home-assistant

ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:rocket-launch
panel_title: Antigravity

ports:
  22/tcp: 2224
ports_description:
  22/tcp: SSH and Antigravity Remote SSH (public key only)

map:
  - type: homeassistant_config
    path: /config
    read_only: false

homeassistant_api: true
hassio_api: true
hassio_role: manager

options:
  telegram_enabled: false
  telegram_bot_token: ""
  telegram_allowed_user_ids: []
  telegram_allowed_chat_ids: []
  authorized_keys: []
  web_terminal_auto_start_antigravity: false
  tmux_session_name: antigravity-ha
  antigravity_tool_permission: request-review
  antigravity_terminal_sandbox: false
  antigravity_sensitive_data_access: false
  antigravity_user_files_update_mode: preserve
  home_assistant_browser_auto_auth: true
  log_level: info

schema:
  telegram_enabled: bool
  telegram_bot_token: password?
  telegram_allowed_user_ids:
    - str
  telegram_allowed_chat_ids:
    - str
  authorized_keys:
    - str
  web_terminal_auto_start_antigravity: bool
  tmux_session_name: "match(^[A-Za-z0-9._-]{1,64}$)"
  # Non-request-review values are accepted only so stored upgrade input can be
  # normalized by user-files-update; request-review is the sole effective value.
  antigravity_tool_permission: "list(request-review|proceed-in-sandbox|always-proceed|strict)"
  antigravity_terminal_sandbox: bool
  antigravity_sensitive_data_access: bool
  antigravity_user_files_update_mode: "list(preserve|refresh_managed|reset_v2|refresh_agents|refresh_all)"
  home_assistant_browser_auto_auth: bool
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

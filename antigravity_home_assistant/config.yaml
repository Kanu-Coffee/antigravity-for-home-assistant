---
name: Antigravity for Home Assistant
version: "3.0.0"
breaking_versions:
  - "2.0.0"
  - "2.0.7"
  - "2.0.9"
  - "2.0.11"
  - "2.0.12"
  - "2.0.13"
  - "2.1.0"
  - "3.0.0"
slug: antigravity_home_assistant
description: Antigravity Remote with Home Assistant operations, browser validation, memory, and feedback
url: https://github.com/Kanu-Coffee/antigravity-for-home-assistant
stage: experimental
init: false
arch:
  - aarch64
  - amd64
image: ghcr.io/kanu-coffee/antigravity-for-home-assistant

ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:rocket-launch
panel_title: Antigravity

map:
  - type: homeassistant_config
    path: /config
    read_only: false
  - type: share
    path: /share
    read_only: false
  - type: media
    path: /media
    read_only: false

homeassistant_api: true
hassio_api: true
hassio_role: manager

options:
  remote_control_name: home-assistant
  antigravity_sensitive_data_access: false
  home_assistant_browser_auto_auth: true
  log_level: info

schema:
  remote_control_name: "match(^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$)"
  antigravity_sensitive_data_access: bool
  home_assistant_browser_auto_auth: bool
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

---
name: Antigravity for Home Assistant
version: "1.0.1"
slug: antigravity_home_assistant
description: Antigravity CLI with verified feedback, browser, terminal, and SSH for Home Assistant
url: https://github.com/Kanu-Coffee/antigravity-for-home-assistant
stage: experimental
boot: manual
init: false
arch:
  - amd64

ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:rocket-launch
panel_title: Antigravity

ports:
  22/tcp: 2224
ports_description:
  22/tcp: SSH and Antigravity Remote SSH (public key only)

map:
  - type: homeassistant_config
    path: /config
    read_only: false

homeassistant_api: true
hassio_api: true
hassio_role: manager

options:
  antigravity_token: ""
  telegram_enabled: false
  telegram_bot_token: ""
  telegram_allowed_chat_ids: []
  authorized_keys: []
  web_terminal_auto_start_antigravity: false
  tmux_session_name: antigravity-ha
  antigravity_approval_policy: on-request
  antigravity_sandbox_mode: danger-full-access
  browser_approval_policy: safe
  antigravity_user_files_update_mode: preserve
  home_assistant_browser_auto_auth: true
  log_level: info

schema:
  antigravity_token: password?
  telegram_enabled: bool
  telegram_bot_token: password?
  telegram_allowed_chat_ids:
    - str
  authorized_keys:
    - str
  web_terminal_auto_start_antigravity: bool
  tmux_session_name: "match(^[A-Za-z0-9._-]{1,64}$)"
  antigravity_approval_policy: "list(untrusted|on-request|never)"
  antigravity_sandbox_mode: "list(workspace-write|danger-full-access)"
  browser_approval_policy: "list(safe|never|always)"
  antigravity_user_files_update_mode: "list(preserve|refresh_agents|refresh_all)"
  home_assistant_browser_auto_auth: bool
  home_assistant_browser_token: password?
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

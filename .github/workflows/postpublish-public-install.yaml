---
name: Post-publish public install acceptance

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Published numeric v3 release version; dispatch this workflow at its tag
        required: true
        type: string
      report_json:
        description: Sanitized antigravity-ha-public-install-acceptance/v1 JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: post-publish-public-install-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  accept:
    name: Validate and preserve two-architecture public install evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    steps:
      - name: Authorize maintainer dispatch at the numeric v3 tag
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -Eeuo pipefail
          [[ $EVENT_NAME == workflow_dispatch ]]
          [[ $RELEASE_VERSION =~ ^3\.[0-9]+\.[0-9]+$ ]]
          [[ $GITHUB_REF == "refs/tags/${RELEASE_VERSION}" ]] || {
            echo "public-install acceptance must be dispatched at the exact numeric release tag" >&2
            exit 1
          }
          declare -A checked=()
          for maintainer_login in "$DISPATCH_ACTOR" "$TRIGGERING_ACTOR"; do
            [[ $maintainer_login =~ ^[A-Za-z0-9-]{1,100}$ ]]
            [[ ${checked[$maintainer_login]+yes} ]] && continue
            checked[$maintainer_login]=yes
            permission=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/collaborators/${maintainer_login}/permission" \
              --jq .permission)
            case "$permission" in
              admin|maintain|write) ;;
              *)
                echo "${maintainer_login} is not authorized to accept release evidence" >&2
                exit 1
                ;;
            esac
          done

      - name: Check out the exact annotated release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.version }}

      - name: Resolve the Candidate-bound annotated tag and GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          [[ $(git cat-file -t "refs/tags/${RELEASE_VERSION}") == tag ]]
          source_sha=$(git rev-list --max-count=1 "refs/tags/${RELEASE_VERSION}")
          [[ $source_sha == "$GITHUB_SHA" ]] || {
            echo "workflow ref does not resolve to the annotated tag source" >&2
            exit 1
          }
          tag_message=$(git for-each-ref --format='%(contents)' \
            "refs/tags/${RELEASE_VERSION}")
          candidate_run_id=$(sed -n \
            's/^Candidate-Run-ID: \([1-9][0-9]*\)$/\1/p' \
            <<< "$tag_message")
          candidate_run_attempt=$(sed -n \
            's/^Candidate-Run-Attempt: \([1-9][0-9]*\)$/\1/p' \
            <<< "$tag_message")
          [[ $candidate_run_id =~ ^[1-9][0-9]*$ ]]
          [[ $candidate_run_attempt =~ ^[1-9][0-9]*$ ]]
          expected_message=$(printf \
            'Antigravity for Home Assistant %s\n\nCandidate-Run-ID: %s\nCandidate-Run-Attempt: %s\n' \
            "$RELEASE_VERSION" "$candidate_run_id" "$candidate_run_attempt")
          [[ $tag_message == "$expected_message" ]] || {
            echo "annotated tag message is not the exact Candidate binding" >&2
            exit 1
          }
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}" \
            > published-release.json
          jq --exit-status \
            --arg source_sha "$source_sha" \
            --arg version "$RELEASE_VERSION" '
              .tag_name == $version
              and .target_commitish == $source_sha
              and .draft == false
              and .prerelease == true
              and (.published_at | test(
                "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
              ))
            ' published-release.json >/dev/null
          {
            printf 'candidate_run_attempt=%s\n' "$candidate_run_attempt"
            printf 'candidate_run_id=%s\n' "$candidate_run_id"
            printf 'published_at_utc=%s\n' \
              "$(jq --raw-output .published_at published-release.json)"
            printf 'source_sha=%s\n' "$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the exact successful Candidate artifact
        id: candidate
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ steps.release.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ steps.release.outputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/attempts/${CANDIDATE_RUN_ATTEMPT}" \
            > candidate-run.json
          jq --exit-status \
            --arg source_sha "$SOURCE_SHA" \
            --argjson attempt "$CANDIDATE_RUN_ATTEMPT" '
              .path == ".github/workflows/candidate.yaml"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .run_attempt == $attempt
              and .head_sha == $source_sha
              and .head_branch == "main"
            ' candidate-run.json >/dev/null
          artifact_name="release-candidate-${SOURCE_SHA}-${CANDIDATE_RUN_ID}-${CANDIDATE_RUN_ATTEMPT}"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?name=${artifact_name}" \
            > candidate-artifacts.json
          jq --exit-status \
            --arg artifact "$artifact_name" '
              .total_count == 1
              and (.artifacts | length == 1)
              and .artifacts[0].name == $artifact
              and .artifacts[0].expired == false
              and (.artifacts[0].digest | test("^sha256:[0-9a-f]{64}$"))
            ' candidate-artifacts.json >/dev/null
          {
            printf 'artifact_id=%s\n' \
              "$(jq --raw-output .artifacts[0].id candidate-artifacts.json)"
            printf 'artifact_name=%s\n' "$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Download the exact tag-bound Candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          digest-mismatch: error
          path: candidate-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.candidate_run_id }}

      - name: Validate the complete tag-bound Candidate contract
        id: contract
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/release_contract.py candidate-verify \
            --candidate candidate-evidence/candidate.json \
            --version "$RELEASE_VERSION" \
            --source-sha "${{ steps.release.outputs.source_sha }}" \
            --run-id "${{ steps.release.outputs.candidate_run_id }}" \
            --run-attempt "${{ steps.release.outputs.candidate_run_attempt }}" \
            --github-output "$GITHUB_OUTPUT"
          index_result=$(python3 .github/scripts/release_contract.py index \
            --manifest candidate-evidence/candidate-index.json \
            --expected-arch amd64 \
            --expected-arch aarch64 \
            --expected-digest \
              "$(jq --raw-output .images.generic.digest candidate-evidence/candidate.json)")
          [[ $(jq --raw-output .amd64 <<< "$index_result") == \
            $(jq --raw-output .images.amd64.runtime_digest candidate-evidence/candidate.json) ]]
          [[ $(jq --raw-output .aarch64 <<< "$index_result") == \
            $(jq --raw-output .images.aarch64.runtime_digest candidate-evidence/candidate.json) ]]

      - name: Set up Docker Buildx for anonymous public verification
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
        with:
          version: v0.32.1

      - name: Verify both published GHCR v3 platforms anonymously
        env:
          AMD64_DIGEST: ${{ steps.contract.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.contract.outputs.arm64_digest }}
          GENERIC_DIGEST: ${{ steps.contract.outputs.generic_digest }}
          IMAGE: ${{ steps.contract.outputs.image }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "$anonymous_config"' EXIT
          printf '{}\n' > "${anonymous_config}/config.json"
          export DOCKER_CONFIG=$anonymous_config
          docker buildx imagetools inspect --raw \
            "${IMAGE}:${RELEASE_VERSION}" > public-index.json
          index_result=$(python3 .github/scripts/release_contract.py index \
            --manifest public-index.json \
            --expected-arch amd64 \
            --expected-arch aarch64 \
            --expected-digest "$GENERIC_DIGEST")
          [[ $(jq --raw-output .amd64 <<< "$index_result") == "$AMD64_DIGEST" ]]
          [[ $(jq --raw-output .aarch64 <<< "$index_result") == "$ARM64_DIGEST" ]]
          docker pull --platform linux/amd64 "${IMAGE}@${AMD64_DIGEST}"
          docker pull --platform linux/arm64 "${IMAGE}@${ARM64_DIGEST}"

      - name: Validate and canonicalize sanitized public install report
        env:
          AMD64_DIGEST: ${{ steps.contract.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.contract.outputs.arm64_digest }}
          GENERIC_DIGEST: ${{ steps.contract.outputs.generic_digest }}
          PUBLISHED_AT_UTC: ${{ steps.release.outputs.published_at_utc }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          jq --raw-output '.inputs.report_json' "$GITHUB_EVENT_PATH" \
            > submitted-public-install-report.json
          python3 .github/scripts/release_contract.py public-install-report \
            --candidate candidate-evidence/candidate.json \
            --report submitted-public-install-report.json \
            --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --generic-digest "$GENERIC_DIGEST" \
            --amd64-runtime-digest "$AMD64_DIGEST" \
            --aarch64-runtime-digest "$ARM64_DIGEST" \
            --published-at-utc "$PUBLISHED_AT_UTC" \
            --output public-install-acceptance.json
          chmod 0600 public-install-acceptance.json

      - name: Upload immutable canonical public install artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: public-install-acceptance-${{ inputs.version }}-${{ steps.release.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-install-acceptance.json
          if-no-files-found: error
          retention-days: 90

      - name: Attach or verify the immutable GitHub Release acceptance record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          bash .github/scripts/ensure-release-acceptance.sh \
            "$RELEASE_VERSION" \
            "$SOURCE_SHA" \
            public-install-acceptance.json

      - name: Summarize final public install acceptance binding
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          [[ $RAW_ARTIFACT_DIGEST =~ ^[0-9a-f]{64}$ ]]
          canonical_digest="sha256:$(sha256sum public-install-acceptance.json | cut -d ' ' -f 1)"
          {
            echo '## Post-publish two-architecture public installs accepted'
            echo
            printf -- '- Release: %s at %s\n' "$RELEASE_VERSION" "$SOURCE_SHA"
            printf -- '- Canonical JSON: %s\n' "$canonical_digest"
            printf -- '- Actions artifact: %s (sha256:%s)\n' \
              "$ARTIFACT_ID" "$RAW_ARTIFACT_DIGEST"
            printf -- '- Release asset: public-install-acceptance.json\n'
          } >> "$GITHUB_STEP_SUMMARY"

---
name: Build app candidate

"on":
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      candidate:
        default: false
        required: false
        type: boolean
      candidate_tag:
        default: local-check
        required: false
        type: string
    outputs:
      candidate_artifact:
        description: Immutable automated candidate evidence artifact
        value: ${{ jobs.package-candidate.outputs.artifact_name }}
      candidate_artifact_digest:
        description: GitHub artifact archive SHA-256
        value: ${{ jobs.package-candidate.outputs.artifact_digest }}

jobs:
  prepare:
    name: Prepare immutable candidate metadata
    if: github.repository == 'Kanu-Coffee/antigravity-for-home-assistant'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image: ${{ steps.normalize.outputs.image }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@f4ca6f671bd429efb108c0f2fa0ae8af0215986c
        with:
          path: ./${{ inputs.app }}

      - name: Normalize and validate app information
        id: normalize
        env:
          APP_DESCRIPTION: ${{ fromJSON(steps.info.outputs.description) }}
          APP_IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
          APP_NAME: ${{ fromJSON(steps.info.outputs.name) }}
          APP_URL: ${{ fromJSON(steps.info.outputs.url) }}
          APP_VERSION: ${{ fromJSON(steps.info.outputs.version) }}
          CANDIDATE: ${{ inputs.candidate }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -Eeuo pipefail
          for variable in \
            APP_DESCRIPTION APP_IMAGE APP_NAME APP_URL APP_VERSION; do
            value=${!variable}
            if [[ $value == *$'\n'* || $value == *$'\r'* ]]; then
              echo "App metadata must not contain newlines: ${variable}" >&2
              exit 1
            fi
          done
          [[ $APP_IMAGE == \
            ghcr.io/kanu-coffee/antigravity-for-home-assistant ]]
          [[ $APP_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ $CANDIDATE == true ]]; then
            expected_candidate="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            [[ $CANDIDATE_TAG == "$expected_candidate" ]] || {
              echo "Candidate tag is not bound to source/run/attempt" >&2
              exit 1
            }
          fi
          {
            printf 'image=%s\n' "$APP_IMAGE"
            printf 'image_name=%s\n' "${APP_IMAGE##*/}"
            printf 'registry_prefix=%s\n' "${APP_IMAGE%/*}"
            printf 'version=%s\n' "$APP_VERSION"
            printf 'name=%s\n' "$APP_NAME"
            printf 'description=%s\n' "$APP_DESCRIPTION"
            if [[ -n $APP_URL && $APP_URL != null ]]; then
              printf 'url=%s\n' "$APP_URL"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Prepare native build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10  # 2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }}${{ inputs.candidate && ' staging image' || '' }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    # Deliberately inherit the caller: PR builds receive packages:read while
    # immutable Candidate builds receive packages:write.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Bind the image rootfs to the exact source revision
        id: source-rootfs
        run: |
          source_rootfs_sha256=$(python3 .github/scripts/source-rootfs-manifest.py \
            create \
            --root antigravity_home_assistant/rootfs \
            --manifest antigravity_home_assistant/rootfs/usr/local/share/antigravity-ha/source-rootfs-manifest.json)
          python3 .github/scripts/source-rootfs-manifest.py verify-installed \
            --root antigravity_home_assistant/rootfs \
            --manifest antigravity_home_assistant/rootfs/usr/local/share/antigravity-ha/source-rootfs-manifest.json \
            --exact >/dev/null
          echo "source_rootfs_sha256=${source_rootfs_sha256}" >> "$GITHUB_OUTPUT"

      - name: Build candidate architecture exactly once
        id: build
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10  # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_ROOTFS_SHA256=${{ steps.source-rootfs.outputs.source_rootfs_sha256 }}
          cache-image-tag: ${{ inputs.candidate_tag }}
          container-registry-password: ${{ github.token }}
          context: ./${{ inputs.app }}
          cosign: false
          image: ${{ matrix.image }}
          image-tags: ${{ inputs.candidate_tag }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.antigravity-ha.source-rootfs-sha256=${{ steps.source-rootfs.outputs.source_rootfs_sha256 }}
          push: ${{ inputs.candidate }}
          version: ${{ needs.prepare.outputs.version }}

      - name: Record architecture staging digest
        if: inputs.candidate
        env:
          ARCH: ${{ matrix.arch }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          jq --null-input \
            --arg arch "$ARCH" \
            --arg candidate_tag "$CANDIDATE_TAG" \
            --arg digest "$DIGEST" \
            --arg image "$IMAGE" \
            --arg source_sha "$GITHUB_SHA" \
            --arg version "$VERSION" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema: "antigravity-ha-arch-stage/v1", $arch,
              $candidate_tag, $digest, $image, $source_sha, $version,
              $run_id, $run_attempt}' > "candidate-${ARCH}.json"

      - name: Upload architecture digest record
        if: inputs.candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: candidate-arch-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: candidate-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  assemble-candidate:
    name: Assemble exact generic candidate index
    if: inputs.candidate
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    # Candidate assembly inherits the write-capable Candidate caller. This job
    # is skipped for the read-only PR caller.
    outputs:
      generic_digest: ${{ steps.index.outputs.index_digest }}
      amd64_stage_digest: ${{ steps.records.outputs.amd64_stage_digest }}
      amd64_runtime_digest: ${{ steps.amd64.outputs.amd64 }}
      aarch64_stage_digest: ${{ steps.records.outputs.aarch64_stage_digest }}
      aarch64_runtime_digest: ${{ steps.aarch64.outputs.aarch64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Download exact architecture digest records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: candidate-arch-digest-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true

      - name: Validate staging records
        id: records
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          test "$(find . -maxdepth 1 -name 'candidate-*.json' -type f | wc -l)" -eq 2
          for arch in amd64 aarch64; do
            file="candidate-${arch}.json"
            jq --exit-status \
              --arg arch "$arch" \
              --arg candidate_tag "$CANDIDATE_TAG" \
              --arg source_sha "$GITHUB_SHA" \
              --arg version "$VERSION" \
              --argjson run_id "$GITHUB_RUN_ID" \
              --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
                .schema == "antigravity-ha-arch-stage/v1"
                and .arch == $arch
                and .candidate_tag == $candidate_tag
                and .source_sha == $source_sha
                and .version == $version
                and .run_id == $run_id
                and .run_attempt == $run_attempt
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
              ' "$file" >/dev/null
          done
          {
            printf 'amd64_image=%s\n' \
              "$(jq --raw-output .image candidate-amd64.json)"
            printf 'amd64_stage_digest=%s\n' \
              "$(jq --raw-output .digest candidate-amd64.json)"
            printf 'aarch64_image=%s\n' \
              "$(jq --raw-output .image candidate-aarch64.json)"
            printf 'aarch64_stage_digest=%s\n' \
              "$(jq --raw-output .digest candidate-aarch64.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for candidate assembly
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
        with:
          version: v0.32.1

      - name: Validate exact amd64 staging descriptor
        id: amd64
        env:
          IMAGE: ${{ steps.records.outputs.amd64_image }}
          STAGE_DIGEST: ${{ steps.records.outputs.amd64_stage_digest }}
        run: |
          docker buildx imagetools inspect --raw \
            "${IMAGE}@${STAGE_DIGEST}" > amd64-stage-index.json
          python3 .github/scripts/release_contract.py index \
            --manifest amd64-stage-index.json \
            --expected-arch amd64 \
            --expected-digest "$STAGE_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate exact arm64 staging descriptor
        id: aarch64
        env:
          IMAGE: ${{ steps.records.outputs.aarch64_image }}
          STAGE_DIGEST: ${{ steps.records.outputs.aarch64_stage_digest }}
        run: |
          docker buildx imagetools inspect --raw \
            "${IMAGE}@${STAGE_DIGEST}" > aarch64-stage-index.json
          python3 .github/scripts/release_contract.py index \
            --manifest aarch64-stage-index.json \
            --expected-arch aarch64 \
            --expected-digest "$STAGE_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create generic candidate from exact architecture digests
        id: create
        env:
          AARCH64_IMAGE: ${{ steps.records.outputs.aarch64_image }}
          AARCH64_STAGE_DIGEST: ${{ steps.records.outputs.aarch64_stage_digest }}
          AMD64_IMAGE: ${{ steps.records.outputs.amd64_image }}
          AMD64_STAGE_DIGEST: ${{ steps.records.outputs.amd64_stage_digest }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools create \
            --metadata-file candidate-metadata.json \
            --tag "${IMAGE}:${CANDIDATE_TAG}" \
            "${AMD64_IMAGE}@${AMD64_STAGE_DIGEST}" \
            "${AARCH64_IMAGE}@${AARCH64_STAGE_DIGEST}"
          digest=$(jq --raw-output \
            '."containerimage.descriptor".digest' candidate-metadata.json)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'metadata_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect --raw \
            "${IMAGE}@${digest}" > candidate-index.json

      - name: Validate exact candidate platform descriptors
        id: index
        env:
          AARCH64_RUNTIME_DIGEST: ${{ steps.aarch64.outputs.aarch64 }}
          AMD64_RUNTIME_DIGEST: ${{ steps.amd64.outputs.amd64 }}
          METADATA_DIGEST: ${{ steps.create.outputs.metadata_digest }}
        run: |
          set -Eeuo pipefail
          result=$(python3 .github/scripts/release_contract.py index \
            --manifest candidate-index.json \
            --expected-arch amd64 \
            --expected-arch aarch64 \
            --expected-digest "$METADATA_DIGEST" \
            --github-output "$GITHUB_OUTPUT")
          [[ $(jq --raw-output .amd64 <<< "$result") == \
            "$AMD64_RUNTIME_DIGEST" ]]
          [[ $(jq --raw-output .aarch64 <<< "$result") == \
            "$AARCH64_RUNTIME_DIGEST" ]]

      - name: Upload exact candidate manifest evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: candidate-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate-index.json
            candidate-metadata.json
          if-no-files-found: error
          retention-days: 14

  exact-digest-smoke:
    name: Exact candidate ${{ matrix.platform }} smoke (${{ matrix.suite }})
    if: inputs.candidate
    needs:
      - prepare
      - assemble-candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux/amd64, ha_arch: amd64, suite: browser-approval}
          - {os: ubuntu-24.04, platform: linux/amd64, ha_arch: amd64, suite: container}
          - {os: ubuntu-24.04, platform: linux/amd64, ha_arch: amd64, suite: feedback}
          - {os: ubuntu-24.04, platform: linux/amd64, ha_arch: amd64, suite: managed-auth}
          - {os: ubuntu-24.04, platform: linux/amd64, ha_arch: amd64, suite: managed-plugin}
          - {os: ubuntu-24.04, platform: linux/amd64, ha_arch: amd64, suite: memory}
          - {os: ubuntu-24.04, platform: linux/amd64, ha_arch: amd64, suite: telegram-isolation}
          - {os: ubuntu-24.04, platform: linux/amd64, ha_arch: amd64, suite: update}
          - {os: ubuntu-24.04, platform: linux/amd64, ha_arch: amd64, suite: user-files}
          - {os: ubuntu-24.04-arm, platform: linux/arm64, ha_arch: aarch64, suite: browser-approval}
          - {os: ubuntu-24.04-arm, platform: linux/arm64, ha_arch: aarch64, suite: container}
          - {os: ubuntu-24.04-arm, platform: linux/arm64, ha_arch: aarch64, suite: feedback}
          - {os: ubuntu-24.04-arm, platform: linux/arm64, ha_arch: aarch64, suite: managed-auth}
          - {os: ubuntu-24.04-arm, platform: linux/arm64, ha_arch: aarch64, suite: managed-plugin}
          - {os: ubuntu-24.04-arm, platform: linux/arm64, ha_arch: aarch64, suite: memory}
          - {os: ubuntu-24.04-arm, platform: linux/arm64, ha_arch: aarch64, suite: telegram-isolation}
          - {os: ubuntu-24.04-arm, platform: linux/arm64, ha_arch: aarch64, suite: update}
          - {os: ubuntu-24.04-arm, platform: linux/arm64, ha_arch: aarch64, suite: user-files}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to pull private candidate
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Pull the exact generic candidate digest
        env:
          CANDIDATE_DIGEST: ${{ needs.assemble-candidate.outputs.generic_digest }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          set -Eeuo pipefail
          docker pull --platform "$TEST_PLATFORM" \
            "${IMAGE}@${CANDIDATE_DIGEST}"
          docker tag "${IMAGE}@${CANDIDATE_DIGEST}" \
            antigravity-for-home-assistant:candidate-test

      - name: Run full feasible suite against exact digest
        env:
          HA_ARCH: ${{ matrix.ha_arch }}
          SUITE: ${{ matrix.suite }}
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          set -Eeuo pipefail
          image=antigravity-for-home-assistant:candidate-test
          case "$SUITE" in
            browser-approval) exec bash tests/browser-approval-smoke.sh "$image" ;;
            container) exec bash tests/docker-smoke.sh "$image" ;;
            feedback) exec bash tests/feedback-smoke.sh "$image" ;;
            managed-auth) exec bash tests/managed-auth-smoke.sh "$image" ;;
            managed-plugin) exec bash tests/managed-plugin-update-smoke.sh "$image" ;;
            memory) exec bash tests/memory-smoke.sh "$image" ;;
            telegram-isolation) exec bash tests/telegram-isolation-smoke.sh "$image" ;;
            update) exec bash tests/update-smoke.sh "$image" ;;
            user-files) exec bash tests/user-files-update-smoke.sh "$image" ;;
            *) exit 64 ;;
          esac

  candidate-sbom:
    name: Generate exact leaf SPDX SBOMs
    if: inputs.candidate
    needs:
      - prepare
      - assemble-candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to pull private candidate leaves
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Generate amd64 SPDX from exact leaf
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ needs.prepare.outputs.image }}@${{ needs.assemble-candidate.outputs.amd64_runtime_digest }}
          format: spdx-json
          output-file: antigravity-for-home-assistant-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate arm64 SPDX from exact leaf
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ needs.prepare.outputs.image }}@${{ needs.assemble-candidate.outputs.aarch64_runtime_digest }}
          format: spdx-json
          output-file: antigravity-for-home-assistant-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Enforce SPDX shape and artifact size budget
        run: |
          set -Eeuo pipefail
          for sbom in antigravity-for-home-assistant-*.spdx.json; do
            jq --exit-status '
              (.spdxVersion | startswith("SPDX-"))
              and (.packages | type == "array" and length > 0)
            ' "$sbom" >/dev/null
            size=$(stat --format '%s' "$sbom")
            if (( size >= 16777216 )); then
              echo "SBOM must remain below 16 MiB: ${sbom} (${size})" >&2
              exit 1
            fi
          done

      - name: Upload run-attempt-bound leaf SPDX files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: candidate-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: antigravity-for-home-assistant-*.spdx.json
          if-no-files-found: error
          retention-days: 14

  gap007-release:
    name: Exact amd64 performance and durability release gate
    if: inputs.candidate
    needs:
      - prepare
      - assemble-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to pull the exact private amd64 candidate
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Run fixed-duration GAP-007 against the exact amd64 stage and leaf
        env:
          AMD64_IMAGE: ghcr.io/kanu-coffee/amd64-antigravity-for-home-assistant
          AMD64_RUNTIME_DIGEST: ${{ needs.assemble-candidate.outputs.amd64_runtime_digest }}
          AMD64_STAGE_DIGEST: ${{ needs.assemble-candidate.outputs.amd64_stage_digest }}
        run: |
          set -Eeuo pipefail
          candidate_ref="${AMD64_IMAGE}@${AMD64_STAGE_DIGEST}"
          docker pull --platform linux/amd64 "$candidate_ref"
          tests/performance-durability-soak.sh \
            --mode release \
            --image "$candidate_ref" \
            --candidate-stage-digest "$AMD64_STAGE_DIGEST" \
            --candidate-leaf-digest "$AMD64_RUNTIME_DIGEST" \
            --evidence gap007-release.json >/dev/null
          jq --exit-status \
            --arg leaf "$AMD64_RUNTIME_DIGEST" \
            --arg source "$GITHUB_SHA" \
            --arg stage "$AMD64_STAGE_DIGEST" '
              .requirement_id == "GAP-007"
              and .mode == "release"
              and .result == "PASS"
              and .closure_eligible == true
              and .provenance.git_commit == $source
              and .provenance.candidate_revision == $source
              and .provenance.candidate_stage_digest == $stage
              and .provenance.candidate_leaf_digest == $leaf
            ' gap007-release.json >/dev/null

      - name: Upload run-attempt-bound GAP-007 release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: candidate-gap007-${{ github.run_id }}-${{ github.run_attempt }}
          path: gap007-release.json
          if-no-files-found: error
          retention-days: 14

  package-candidate:
    name: Package immutable automated candidate evidence
    if: inputs.candidate
    needs:
      - prepare
      - assemble-candidate
      - exact-digest-smoke
      - candidate-sbom
      - gap007-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Download manifest and SPDX evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: candidate-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true

      - name: Build machine-verifiable candidate record
        env:
          AARCH64_IMAGE: ghcr.io/kanu-coffee/aarch64-antigravity-for-home-assistant
          AARCH64_RUNTIME_DIGEST: ${{ needs.assemble-candidate.outputs.aarch64_runtime_digest }}
          AARCH64_STAGE_DIGEST: ${{ needs.assemble-candidate.outputs.aarch64_stage_digest }}
          AMD64_IMAGE: ghcr.io/kanu-coffee/amd64-antigravity-for-home-assistant
          AMD64_RUNTIME_DIGEST: ${{ needs.assemble-candidate.outputs.amd64_runtime_digest }}
          AMD64_STAGE_DIGEST: ${{ needs.assemble-candidate.outputs.amd64_stage_digest }}
          CANDIDATE_DIGEST: ${{ needs.assemble-candidate.outputs.generic_digest }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/release_contract.py candidate \
            --version "$VERSION" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --candidate-tag "$CANDIDATE_TAG" \
            --generic-image "$IMAGE" \
            --generic-digest "$CANDIDATE_DIGEST" \
            --amd64-image "$AMD64_IMAGE" \
            --amd64-stage-digest "$AMD64_STAGE_DIGEST" \
            --amd64-runtime-digest "$AMD64_RUNTIME_DIGEST" \
            --aarch64-image "$AARCH64_IMAGE" \
            --aarch64-stage-digest "$AARCH64_STAGE_DIGEST" \
            --aarch64-runtime-digest "$AARCH64_RUNTIME_DIGEST" \
            --manifest candidate-index.json \
            --gap007-evidence gap007-release.json \
            --output candidate.json
          for sbom in antigravity-for-home-assistant-*.spdx.json; do
            (( $(stat --format '%s' "$sbom") < 16777216 ))
          done

      - name: Set candidate artifact name
        id: names
        run: |
          printf 'artifact_name=release-candidate-%s-%s-%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            >> "$GITHUB_OUTPUT"

      - name: Upload immutable automated candidate evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            candidate.json
            candidate-index.json
            gap007-release.json
            antigravity-for-home-assistant-amd64.spdx.json
            antigravity-for-home-assistant-arm64.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish candidate binding summary
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_NAME: ${{ steps.names.outputs.artifact_name }}
        run: |
          {
            echo '## Immutable candidate ready for HAOS rehearsal'
            echo
            printf -- "- Artifact: \`%s\`\n" "$ARTIFACT_NAME"
            printf -- "- Artifact digest: \`%s\`\n" "$ARTIFACT_DIGEST"
            printf -- "- Source: \`%s\`\n" "$GITHUB_SHA"
            echo
            echo 'Run Candidate / finalize only after the exact digest HAOS evidence is available.'
          } >> "$GITHUB_STEP_SUMMARY"

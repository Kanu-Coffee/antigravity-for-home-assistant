---
name: Pull request image build

"on":
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/build-app.yaml"
      - ".github/workflows/builder.yaml"
      - ".github/workflows/candidate.yaml"
      - "antigravity_home_assistant/**"
      - "tests/*smoke.sh"

permissions:
  contents: read

concurrency:
  group: builder-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the v3 App metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Get App information
        id: info
        uses: home-assistant/actions/helpers/info@f4ca6f671bd429efb108c0f2fa0ae8af0215986c
        with:
          path: ./antigravity_home_assistant

      - name: Require the 3.x public image contract
        env:
          APP_IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
          APP_VERSION: ${{ fromJSON(steps.info.outputs.version) }}
        run: |
          set -Eeuo pipefail
          [[ $APP_IMAGE == \
            ghcr.io/kanu-coffee/antigravity-for-home-assistant ]]
          [[ $APP_VERSION =~ ^3\.[0-9]+\.[0-9]+$ ]]

  pull-request-build:
    name: Build both architectures without publishing
    needs: validate
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-app.yaml
    with:
      app: antigravity_home_assistant
      candidate: false
      candidate_tag: local-check

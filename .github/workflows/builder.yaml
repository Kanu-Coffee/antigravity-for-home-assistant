---
name: Builder

"on":
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/build-app.yaml"
      - ".github/workflows/builder.yaml"
      - ".github/workflows/candidate.yaml"
      - "antigravity_home_assistant/**"
      - "tests/*smoke.sh"
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate annotated tag and release binding
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.info.outputs.version && fromJSON(steps.info.outputs.version) }}
      source_sha: ${{ steps.tag.outputs.source_sha }}
      candidate_run_id: ${{ steps.tag.outputs.candidate_run_id }}
      candidate_run_attempt: ${{ steps.tag.outputs.candidate_run_attempt }}
      evidence_run_id: ${{ steps.tag.outputs.evidence_run_id }}
      evidence_run_attempt: ${{ steps.tag.outputs.evidence_run_attempt }}
      evidence_artifact: ${{ steps.tag.outputs.evidence_artifact }}
      evidence_digest: ${{ steps.tag.outputs.evidence_digest }}
    steps:
      - name: Check out repository with annotated tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@f4ca6f671bd429efb108c0f2fa0ae8af0215986c
        with:
          path: ./antigravity_home_assistant

      - name: Validate image and numeric release tag
        env:
          APP_IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
          APP_VERSION: ${{ fromJSON(steps.info.outputs.version) }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ $APP_IMAGE == \
            ghcr.io/kanu-coffee/antigravity-for-home-assistant ]]
          [[ $APP_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            [[ $RELEASE_TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ $RELEASE_TAG == "$APP_VERSION" ]] || {
              echo "Release tag and App version differ" >&2
              exit 1
            }
          fi

      - name: Parse strict annotated-tag evidence trailers
        if: github.event_name == 'push'
        id: tag
        env:
          APP_VERSION: ${{ fromJSON(steps.info.outputs.version) }}
        run: |
          bash .github/scripts/parse-release-tag.sh "$APP_VERSION"

  pull-request-build:
    name: Build both architectures without publishing
    if: github.event_name == 'pull_request'
    needs: validate
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-app.yaml
    with:
      app: antigravity_home_assistant
      candidate: false
      candidate_tag: local-check

  evidence:
    name: Verify tag, source, run, artifact, and HAOS evidence
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      image: ${{ steps.contract.outputs.image }}
      generic_digest: ${{ steps.contract.outputs.generic_digest }}
      candidate_tag: ${{ steps.contract.outputs.candidate_tag }}
      amd64_image: ${{ steps.contract.outputs.amd64_image }}
      amd64_stage_digest: ${{ steps.contract.outputs.amd64_stage_digest }}
      amd64_digest: ${{ steps.contract.outputs.amd64_digest }}
      arm64_image: ${{ steps.contract.outputs.arm64_image }}
      arm64_stage_digest: ${{ steps.contract.outputs.arm64_stage_digest }}
      arm64_digest: ${{ steps.contract.outputs.arm64_digest }}
    steps:
      - name: Check out exact tag source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Verify finalizer run and immutable artifact via API
        id: artifact
        env:
          ARTIFACT_NAME: ${{ needs.validate.outputs.evidence_artifact }}
          EVIDENCE_DIGEST: ${{ needs.validate.outputs.evidence_digest }}
          EVIDENCE_RUN_ATTEMPT: ${{ needs.validate.outputs.evidence_run_attempt }}
          EVIDENCE_RUN_ID: ${{ needs.validate.outputs.evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" \
            > evidence-run.json
          jq --exit-status \
            --arg source_sha "$SOURCE_SHA" \
            --argjson attempt "$EVIDENCE_RUN_ATTEMPT" '
              .path == ".github/workflows/candidate.yaml"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .run_attempt == $attempt
              and .head_sha == $source_sha
            ' evidence-run.json >/dev/null
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}/artifacts?name=${ARTIFACT_NAME}" \
            > evidence-artifacts.json
          jq --exit-status \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg digest "$EVIDENCE_DIGEST" '
              .total_count == 1
              and (.artifacts | length == 1)
              and .artifacts[0].name == $artifact_name
              and .artifacts[0].expired == false
              and .artifacts[0].digest == $digest
            ' evidence-artifacts.json >/dev/null

      - name: Download exact final release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.validate.outputs.evidence_artifact }}
          path: release-evidence
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.evidence_run_id }}

      - name: Validate complete release evidence contract
        id: contract
        env:
          APP_VERSION: ${{ needs.validate.outputs.app_version }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.validate.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ needs.validate.outputs.candidate_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ needs.validate.outputs.evidence_run_attempt }}
          EVIDENCE_RUN_ID: ${{ needs.validate.outputs.evidence_run_id }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/release_contract.py release \
            --evidence release-evidence/release-evidence.json \
            --gap007-evidence release-evidence/gap007-release.json \
            --haos-gates-dir release-evidence/haos-gates \
            --version "$APP_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --evidence-run-id "$EVIDENCE_RUN_ID" \
            --evidence-run-attempt "$EVIDENCE_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"
          index_result=$(python3 .github/scripts/release_contract.py index \
            --manifest release-evidence/candidate-index.json \
            --expected-arch amd64 \
            --expected-arch aarch64 \
            --expected-digest \
              "$(jq --raw-output '.candidate.images.generic.digest' \
                release-evidence/release-evidence.json)")
          [[ $(jq --raw-output .amd64 <<< "$index_result") == \
            $(jq --raw-output '.candidate.images.amd64.runtime_digest' \
              release-evidence/release-evidence.json) ]]
          [[ $(jq --raw-output .aarch64 <<< "$index_result") == \
            $(jq --raw-output '.candidate.images.aarch64.runtime_digest' \
              release-evidence/release-evidence.json) ]]
          for sbom in release-evidence/*.spdx.json; do
            jq --exit-status '
              (.spdxVersion | startswith("SPDX-"))
              and (.packages | type == "array" and length > 0)
            ' "$sbom" >/dev/null
            (( $(stat --format '%s' "$sbom") < 16777216 ))
          done
          python3 .github/scripts/candidate_repository.py verify \
            --repository release-evidence/candidate-repository \
            --manifest release-evidence/candidate-repository-manifest.json >/dev/null
          python3 .github/scripts/candidate_repository.py verify-archive \
            --repository release-evidence/candidate-repository \
            --manifest release-evidence/candidate-repository-manifest.json \
            --archive release-evidence/haos-candidate-repository.zip
          [[ sha256:$(sha256sum release-evidence/candidate-repository-manifest.json | cut -d ' ' -f 1) == \
            $(jq --raw-output '.candidate.haos_rehearsal.repository_manifest_sha256' \
              release-evidence/release-evidence.json) ]]
          [[ sha256:$(sha256sum release-evidence/haos-candidate-repository.zip | cut -d ' ' -f 1) == \
            $(jq --raw-output '.candidate.haos_rehearsal.repository_archive_sha256' \
              release-evidence/release-evidence.json) ]]

      - name: Verify original candidate run and artifact binding
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ needs.validate.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ needs.validate.outputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            > candidate-run.json
          jq --exit-status \
            --arg source_sha "$SOURCE_SHA" \
            --argjson attempt "$CANDIDATE_RUN_ATTEMPT" '
              .path == ".github/workflows/candidate.yaml"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .run_attempt == $attempt
              and .head_sha == $source_sha
            ' candidate-run.json >/dev/null
          artifact_name="release-candidate-${SOURCE_SHA}-${CANDIDATE_RUN_ID}-${CANDIDATE_RUN_ATTEMPT}"
          expected_digest=$(jq --raw-output .candidate_artifact_digest \
            release-evidence/release-evidence.json)
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?name=${artifact_name}" \
            > candidate-artifacts.json
          jq --exit-status \
            --arg artifact_name "$artifact_name" \
            --arg digest "$expected_digest" '
              .total_count == 1
              and (.artifacts | length == 1)
              and .artifacts[0].name == $artifact_name
              and .artifacts[0].expired == false
              and .artifacts[0].digest == $digest
            ' candidate-artifacts.json >/dev/null

  anonymous-preflight:
    name: Require public anonymous candidate before numeric tags
    if: github.event_name == 'push'
    needs:
      - validate
      - evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out exact tag source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
        with:
          version: v0.32.1

      - name: Verify package visibility and anonymous exact pulls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/anonymous-candidate-preflight.sh \
            "${{ needs.evidence.outputs.image }}" \
            "${{ needs.evidence.outputs.generic_digest }}" \
            "${{ needs.evidence.outputs.amd64_image }}" \
            "${{ needs.evidence.outputs.amd64_stage_digest }}" \
            "${{ needs.evidence.outputs.arm64_image }}" \
            "${{ needs.evidence.outputs.arm64_stage_digest }}" \
            .github/scripts/release_contract.py

  promote:
    name: Carbon-copy numeric tags without rebuilding
    if: github.event_name == 'push'
    needs:
      - validate
      - evidence
      - anonymous-preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out exact tag source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Log in for promotion
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
        with:
          version: v0.32.1

      - name: Ensure exact architecture and generic tags
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.app_version }}
        run: |
          set -Eeuo pipefail
          bash .github/scripts/release-oci.sh ensure-tag \
            "${{ needs.evidence.outputs.amd64_image }}:${VERSION}" \
            "${{ needs.evidence.outputs.amd64_image }}@${{ needs.evidence.outputs.amd64_stage_digest }}" \
            "${{ needs.evidence.outputs.amd64_stage_digest }}"
          bash .github/scripts/release-oci.sh ensure-tag \
            "${{ needs.evidence.outputs.arm64_image }}:${VERSION}" \
            "${{ needs.evidence.outputs.arm64_image }}@${{ needs.evidence.outputs.arm64_stage_digest }}" \
            "${{ needs.evidence.outputs.arm64_stage_digest }}"
          bash .github/scripts/release-oci.sh ensure-tag \
            "${{ needs.evidence.outputs.image }}:${VERSION}" \
            "${{ needs.evidence.outputs.image }}@${{ needs.evidence.outputs.generic_digest }}" \
            "${{ needs.evidence.outputs.generic_digest }}"

      - name: Verify exact promoted platform descriptors
        env:
          AMD64_DIGEST: ${{ needs.evidence.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.evidence.outputs.arm64_digest }}
          GENERIC_DIGEST: ${{ needs.evidence.outputs.generic_digest }}
          IMAGE: ${{ needs.evidence.outputs.image }}
          VERSION: ${{ needs.validate.outputs.app_version }}
        run: |
          docker buildx imagetools inspect --raw \
            "${IMAGE}:${VERSION}" > promoted-index.json
          result=$(python3 .github/scripts/release_contract.py index \
            --manifest promoted-index.json \
            --expected-arch amd64 \
            --expected-arch aarch64 \
            --expected-digest "$GENERIC_DIGEST")
          [[ $(jq --raw-output .amd64 <<< "$result") == "$AMD64_DIGEST" ]]
          [[ $(jq --raw-output .aarch64 <<< "$result") == "$ARM64_DIGEST" ]]

  supply-chain:
    name: Attest, sign, and verify exact promoted digests
    if: github.event_name == 'push'
    needs:
      - validate
      - evidence
      - promote
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out exact tag source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Download exact final release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.validate.outputs.evidence_artifact }}
          path: release-evidence
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.evidence_run_id }}

      - name: Log in for attestations and signing
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Attest generic build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ needs.evidence.outputs.image }}
          subject-digest: ${{ needs.evidence.outputs.generic_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest exact amd64 SPDX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ needs.evidence.outputs.image }}
          subject-digest: ${{ needs.evidence.outputs.amd64_digest }}
          sbom-path: release-evidence/antigravity-for-home-assistant-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest exact arm64 SPDX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ needs.evidence.outputs.image }}
          subject-digest: ${{ needs.evidence.outputs.arm64_digest }}
          sbom-path: release-evidence/antigravity-for-home-assistant-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign every promoted immutable subject
        env:
          AMD64_DIGEST: ${{ needs.evidence.outputs.amd64_digest }}
          AMD64_IMAGE: ${{ needs.evidence.outputs.amd64_image }}
          AMD64_STAGE_DIGEST: ${{ needs.evidence.outputs.amd64_stage_digest }}
          ARM64_DIGEST: ${{ needs.evidence.outputs.arm64_digest }}
          ARM64_IMAGE: ${{ needs.evidence.outputs.arm64_image }}
          ARM64_STAGE_DIGEST: ${{ needs.evidence.outputs.arm64_stage_digest }}
          GENERIC_DIGEST: ${{ needs.evidence.outputs.generic_digest }}
          IMAGE: ${{ needs.evidence.outputs.image }}
        run: |
          set -Eeuo pipefail
          references=(
            "${IMAGE}@${GENERIC_DIGEST}"
            "${IMAGE}@${AMD64_DIGEST}"
            "${IMAGE}@${ARM64_DIGEST}"
            "${AMD64_IMAGE}@${AMD64_STAGE_DIGEST}"
            "${ARM64_IMAGE}@${ARM64_STAGE_DIGEST}"
          )
          for reference in "${references[@]}"; do
            cosign sign --yes "$reference"
          done

      - name: Verify exact Cosign identity and workflow claims
        env:
          AMD64_DIGEST: ${{ needs.evidence.outputs.amd64_digest }}
          AMD64_IMAGE: ${{ needs.evidence.outputs.amd64_image }}
          AMD64_STAGE_DIGEST: ${{ needs.evidence.outputs.amd64_stage_digest }}
          ARM64_DIGEST: ${{ needs.evidence.outputs.arm64_digest }}
          ARM64_IMAGE: ${{ needs.evidence.outputs.arm64_image }}
          ARM64_STAGE_DIGEST: ${{ needs.evidence.outputs.arm64_stage_digest }}
          GENERIC_DIGEST: ${{ needs.evidence.outputs.generic_digest }}
          IMAGE: ${{ needs.evidence.outputs.image }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.app_version }}
        run: |
          set -Eeuo pipefail
          identity="https://github.com/Kanu-Coffee/antigravity-for-home-assistant/.github/workflows/builder.yaml@refs/tags/${VERSION}"
          references=(
            "${IMAGE}@${GENERIC_DIGEST}"
            "${IMAGE}@${AMD64_DIGEST}"
            "${IMAGE}@${ARM64_DIGEST}"
            "${AMD64_IMAGE}@${AMD64_STAGE_DIGEST}"
            "${ARM64_IMAGE}@${ARM64_STAGE_DIGEST}"
          )
          for reference in "${references[@]}"; do
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer \
                https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$SOURCE_SHA" \
              --certificate-github-workflow-trigger push \
              "$reference" >/dev/null
          done

      - name: Verify provenance and leaf SPDX retrievability
        env:
          AMD64_DIGEST: ${{ needs.evidence.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.evidence.outputs.arm64_digest }}
          GENERIC_DIGEST: ${{ needs.evidence.outputs.generic_digest }}
          IMAGE: ${{ needs.evidence.outputs.image }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          common=(
            --repo "$GITHUB_REPOSITORY"
            --cert-identity "https://github.com/Kanu-Coffee/antigravity-for-home-assistant/.github/workflows/builder.yaml@${GITHUB_REF}"
            --signer-workflow "Kanu-Coffee/antigravity-for-home-assistant/.github/workflows/builder.yaml"
            --source-digest "$SOURCE_SHA"
            --source-ref "$GITHUB_REF"
            --deny-self-hosted-runners
          )
          gh attestation verify \
            "oci://${IMAGE}@${GENERIC_DIGEST}" \
            "${common[@]}" \
            --predicate-type https://slsa.dev/provenance/v1 >/dev/null
          for digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            gh attestation verify \
              "oci://${IMAGE}@${digest}" \
              "${common[@]}" \
              --predicate-type https://spdx.dev/Document/v2.3 >/dev/null
          done

      - name: Verify numeric image anonymously after signing
        env:
          AMD64_DIGEST: ${{ needs.evidence.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.evidence.outputs.arm64_digest }}
          GENERIC_DIGEST: ${{ needs.evidence.outputs.generic_digest }}
          IMAGE: ${{ needs.evidence.outputs.image }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.app_version }}
        run: |
          set -Eeuo pipefail
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "$anonymous_config"' EXIT
          printf '{}\n' > "${anonymous_config}/config.json"
          export DOCKER_CONFIG=$anonymous_config
          docker buildx imagetools inspect --raw \
            "${IMAGE}:${VERSION}" > public-index.json
          result=$(python3 .github/scripts/release_contract.py index \
            --manifest public-index.json \
            --expected-arch amd64 \
            --expected-arch aarch64 \
            --expected-digest "$GENERIC_DIGEST")
          [[ $(jq --raw-output .amd64 <<< "$result") == "$AMD64_DIGEST" ]]
          [[ $(jq --raw-output .aarch64 <<< "$result") == "$ARM64_DIGEST" ]]
          docker pull --platform linux/amd64 "${IMAGE}:${VERSION}"
          docker pull --platform linux/arm64 "${IMAGE}:${VERSION}"
          identity="https://github.com/Kanu-Coffee/antigravity-for-home-assistant/.github/workflows/builder.yaml@refs/tags/${VERSION}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer \
              https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-sha "$SOURCE_SHA" \
            --certificate-github-workflow-trigger push \
            "${IMAGE}@${GENERIC_DIGEST}" >/dev/null

  github-release:
    name: Create or verify deterministic GitHub prerelease
    if: github.event_name == 'push'
    needs:
      - validate
      - evidence
      - supply-chain
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact tag source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Download exact final release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.validate.outputs.evidence_artifact }}
          path: release-evidence
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.evidence_run_id }}

      - name: Generate deterministic evidence-bound release notes
        run: |
          python3 .github/scripts/release_contract.py notes \
            --evidence release-evidence/release-evidence.json \
            --gap007-evidence release-evidence/gap007-release.json \
            --haos-gates-dir release-evidence/haos-gates \
            --output release-evidence/release-notes.md

      - name: Create, resume, or reject conflicting GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.app_version }}
        run: |
          bash .github/scripts/ensure-github-release.sh \
            "$VERSION" \
            "$SOURCE_SHA" \
            release-evidence/release-notes.md \
            release-evidence/release-evidence.json \
            release-evidence/candidate.json \
            release-evidence/gap007-release.json \
            release-evidence/manual-haos-evidence.json \
            release-evidence/candidate-repository-manifest.json \
